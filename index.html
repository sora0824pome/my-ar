<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Targets</title><meta itemprop="name" content="Image Targets"><meta name="twitter:title" content="Image Targets"><meta property="og:title" content="Image Targets"><meta property="og:site_name" content="Image Targets"><meta name="description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><meta itemprop="description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><meta property="og:description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><meta name="twitter:description" content="This project demonstrates how to use Image Targets to anchor virtual content to images in the real world."><script crossorigin="anonymous" src="./external/runtime/runtime.js"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script><script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script><meta property="og:image" content="https://8thwall.org/studio-image-targets-example/assets/preview.png"><script>const observer = new MutationObserver(() => {
      const promptBox = document.querySelector('.prompt-box-8w')

      if (!promptBox) return

      const message = promptBox.querySelector('p')
      const buttons = promptBox.querySelectorAll('.prompt-button-8w')

      if (message) {
        message.textContent =
          'ARを体験するには、端末のセンサーへのアクセスが必要です。'
      }

      if (buttons[0]) {
        buttons[0].textContent = 'キャンセル'
      }

      if (buttons[1]) {
        buttons[1].textContent = 'ARを開始'
      }
    })

    observer.observe(document.body, {
      childList: true,
      subtree: true,
    })</script><style>.prompt-box-8w {
      font-family: 'Nunito-SemiBold', 'Nunito', sans-serif;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 15em;
      max-width: 100%;
      font-size: 20px;
      z-index: 888;
      background-color:#ffffff7d;
      overflow: hidden;
      border-radius: 10px;
      padding: 0.5em;
      color: #323232;
      text-align: center;
    }

  .prompt-box-8w p {
    margin: 0.5em 0.5em 1em;
  }

  .prompt-button-8w {
    flex: 1 0 0;
    min-width: 5em;
    text-align: center;
    color: white;
    background-color: #818199;
    font-size: inherit;
    font-family: inherit;
    display: block;
    outline: none;
    border: none;
    margin: 0;
    border-radius: 10px;
    padding: 0.37em;
  }

  .button-primary-8w {
    background-color: #2f47c6;
  }</style></head><body><script src="bundle.js"></script></body></html>
